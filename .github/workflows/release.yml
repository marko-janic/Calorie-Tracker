name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prebuild Android project
        working-directory: app
        run: |
          npm ci
          npx expo prebuild --platform android --clean --no-install
      - name: Require signing secrets
        # Without them the Gradle build would fall back to debug signing (9.4),
        # which must never happen for a published APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Secret ANDROID_$name is not set"
              exit 1
            fi
          done
      - name: Decode signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kcal-release.p12"
      - name: Build signed APK
        working-directory: app/android
        env:
          KCAL_UPLOAD_STORE_FILE: ${{ runner.temp }}/kcal-release.p12
          KCAL_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KCAL_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KCAL_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

  images:
    needs: apk
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: artifacts/apk
      - run: mv artifacts/apk/app-release.apk artifacts/apk/kcal.apk
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kcal-server:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kcal-server:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Caddy image
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kcal-caddy:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/kcal-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  github-release:
    needs: [apk, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          mv app-release.apk "kcal-$VERSION.apk"
          gh release create "v$VERSION" "kcal-$VERSION.apk" --repo "${{ github.repository }}" --title "v$VERSION" --generate-notes
